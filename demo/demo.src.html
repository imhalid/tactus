<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>tactus — demo</title>
<style>
:root{--bg:#f6f2ec;--card:#fffdf9;--ink:#2b2622;--mute:#8a8178;--acc:#c98a4b;--line:#e8dfd3}
@media(prefers-color-scheme:dark){:root{--bg:#1b1815;--card:#24201c;--ink:#f1ebe3;--mute:#9a9187;--acc:#e0a26a;--line:#332d27}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;padding:40px 20px 80px}
main{max-width:860px;margin:auto}h1{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}p.sub{color:var(--mute);margin:0 0 28px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin:32px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,.chip{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 16px;cursor:pointer;transition:transform .12s,background .12s}
button:hover{background:color-mix(in srgb,var(--card) 88%,var(--acc))}button:active{transform:scale(.97)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer}
.list{display:grid;gap:8px;max-width:340px}.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:grab}
.zone{border:2px dashed var(--line);border-radius:16px;min-height:90px;padding:14px;color:var(--mute);width:260px;transition:border-color .15s}
.zone.hot{border-color:var(--acc)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;border:0;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .2s}
.sw[aria-checked=true]{background:var(--acc)}.sw[aria-checked=true]::after{transform:translateX(18px)}
input[type=range]{width:260px;accent-color:var(--acc)}
input[type=text]{font:inherit;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:260px}
</style></head><body><main>
<h1>tactus</h1><p class="sub">Sıfır ses dosyası — hepsi Web Audio ile kodla üretiliyor. Kulaklıkla dene.</p>
<h2>Tema</h2><div class="row" id="themes"></div>
<h2>Butonlar — data-sound="button" (hover, basış, bırakış)</h2>
<div class="row"><button data-sound="button">Kaydet</button><button data-sound="button" data-sound-click="off" id="ok">Onayla (success)</button><button data-sound="button" id="err">Hata (error)</button><button data-sound="button" id="ntf">Bildirim</button></div>
<h2>Kartlar — data-sound="card"</h2>
<div class="grid"><div class="card" data-sound="card">Kart A</div><div class="card" data-sound="card">Kart B</div><div class="card" data-sound="card" data-sound-click="pop">Kart C (pop)</div></div>
<h2>Toggle / slider / input</h2>
<div class="row"><button class="sw" role="switch" aria-checked="false" data-sound="toggle" id="sw"></button>
<input type="range" min="0" max="100" value="50" id="rng"><input type="text" placeholder="yaz…" data-sound="typing"></div>
<h2>Drag &amp; drop — draggable + dropzone</h2>
<div class="row" style="align-items:flex-start;gap:30px"><div class="list" id="list"></div><div class="zone" data-sound="dropzone" id="zone">Buraya bırak</div></div>
<h2>Tüm sesler</h2><div class="row" id="all"></div>
</main><script>
const {play,configure,themes,builtinSounds}=window.Tactus;
const names=Object.keys(builtinSounds);
const $=s=>document.querySelector(s);
for(const t of Object.keys(themes)){const b=document.createElement('button');b.textContent=t;b.dataset.sound='tab';b.onclick=()=>{configure({theme:t});[...$('#themes').children].forEach(x=>x.classList.toggle('on',x===b));play('select')};if(t==='cozy')b.classList.add('on');$('#themes').append(b)}
for(const n of names){const b=document.createElement('button');b.textContent=n;b.onclick=()=>play(n);b.dataset.sound='quiet';$('#all').append(b)}
$('#ok').onclick=()=>play('success');$('#err').onclick=()=>play('error');$('#ntf').onclick=()=>play('notify');
$('#sw').onclick=e=>{const s=e.currentTarget;s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true')};
$('#rng').oninput=e=>play('slide',{value:e.target.value/100});
for(const t of ['Alışveriş','Tasarım','Kod','Yürüyüş']){const d=document.createElement('div');d.className='item';d.draggable=true;d.textContent=t;d.dataset.sound='draggable';$('#list').append(d)}
const z=$('#zone');z.ondragover=e=>{e.preventDefault();z.classList.add('hot')};z.ondragleave=()=>z.classList.remove('hot');
z.ondrop=e=>{e.preventDefault();z.classList.remove('hot')};
</script></body></html>
